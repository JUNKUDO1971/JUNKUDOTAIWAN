<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>客服罐頭訊息工具</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #25272b;
    --muted: #777d87;
    --line: #e5e7eb;
    --accent: #5b67d8;
    --accent-soft: #eef0ff;
    --danger: #d84f5f;
    --shadow: 0 8px 30px rgba(30,35,50,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  header {
    height: 70px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 20px; }
  .brand-icon {
    width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft);
    display: grid; place-items: center;
  }
  .header-actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--line); background: white; color: var(--text);
    border-radius: 9px; padding: 9px 13px;
  }
  .btn:hover { background: #f8f8fa; }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .layout {
    width: min(1450px, 100%); margin: 0 auto; padding: 22px;
    display: grid; grid-template-columns: 210px minmax(0, 1fr) 340px; gap: 18px;
    flex: 1;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 15px;
    box-shadow: var(--shadow);
  }
  .sidebar { padding: 14px; align-self: start; position: sticky; top: 92px; }
  .section-title {
    font-size: 12px; color: var(--muted); font-weight: 700;
    letter-spacing: .08em; padding: 8px 10px;
  }
  .category {
    width: 100%; display: flex; align-items: center; gap: 9px; border: 0;
    background: transparent; padding: 10px; border-radius: 9px; text-align: left;
    color: var(--text);
  }
  .category:hover { background: #f6f7f9; }
  .category.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .main { min-width: 0; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap span { position: absolute; left: 13px; top: 11px; }
  .search {
    width: 100%; border: 1px solid var(--line); background: white; border-radius: 10px;
    padding: 10px 12px 10px 38px; outline: none;
  }
  .search:focus, textarea:focus, input:focus, select:focus {
    border-color: #aab0ee; box-shadow: 0 0 0 3px rgba(91,103,216,.1);
  }
  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 3px 12px; }
  .list-head h2 { margin: 0; font-size: 18px; }
  .muted { color: var(--muted); font-size: 13px; }
  .cards { display: grid; gap: 11px; }
  .card {
    background: white; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; transition: .15s;
  }
  .card:hover { border-color: #cdd0ef; box-shadow: 0 5px 18px rgba(30,35,50,.06); }
  .card-top { display: flex; gap: 10px; align-items: center; }
  .card-title { font-weight: 700; flex: 1; }
  .badge {
    font-size: 11px; color: var(--accent); background: var(--accent-soft);
    padding: 4px 7px; border-radius: 999px;
  }
  .favorite {
    border: 0; background: transparent; font-size: 18px; padding: 2px 4px; color: #b9bdc6;
  }
  .favorite.on { color: #e5a92e; }
  .card-text {
    white-space: pre-wrap; line-height: 1.45; color: #4c515b;
    margin: 7px 0 9px; font-size: 13px;
    max-height: 58px; overflow: hidden;
  }
  .card-actions { display: flex; gap: 7px; }
  .small-btn {
    border: 1px solid var(--line); background: white; border-radius: 8px; padding: 7px 10px;
    font-size: 13px;
  }
  .small-btn.copy { background: var(--accent); border-color: var(--accent); color: white; }
  .right { padding: 18px; align-self: start; position: sticky; top: 92px; }
  .right h2 { margin: 0 0 14px; font-size: 17px; }
  .form-group { margin-bottom: 13px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
  input, textarea, select {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 10px;
    outline: none; background: white;
  }
  textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
  .form-actions { display: flex; gap: 8px; }
  .empty { text-align: center; padding: 55px 20px; color: var(--muted); }
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(20,23,30,.38);
    z-index: 30; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }

  .quick-empty { color: var(--muted); font-size: 13px; line-height: 1.7; text-align: center; padding: 40px 15px; }
  #quickText { min-height: 300px; resize: vertical; line-height: 1.7; }
  #categoryBackdrop .modal { max-height: calc(100vh - 40px); overflow-y: auto; box-sizing: border-box; }
  @media (max-width: 600px) {
    #categoryBackdrop { padding: 10px; }
    #categoryBackdrop .modal { width: 100%; max-width: 100%; max-height: calc(100vh - 20px); overflow-y: auto; }
  }
  .modal {
    width: min(520px, 100%); background: white; border-radius: 15px; padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal h2 { margin: 0 0 16px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 15px);
    background: #25272b; color: white; padding: 10px 15px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: .2s; z-index: 50; font-size: 14px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .mobile-menu { display: none; }

  .drag-handle{cursor:grab;user-select:none;color:var(--muted);font-size:16px}
  .card.dragging,.category.dragging{opacity:.45}

  .bulk-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid #dfe2ff;border-radius:10px;padding:9px 11px;margin-bottom:12px;font-size:13px}
  .bulk-bar label{margin:0;font-weight:500;display:flex;align-items:center;gap:5px}
  .bulk-bar select{width:auto;min-width:145px;padding:7px 9px}
  .bulk-bar .selected-count{color:var(--muted);margin-right:auto}
  .check-wrap{display:flex;align-items:center;margin:0}
  .check-wrap input{width:17px;height:17px}
  .card.selected{border-color:#aeb4f1;background:#fafaff}
  .cat-manage-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
  .cat-manage-name{flex:1;font-weight:600}
  .cat-manage-count{color:var(--muted);font-size:12px}

#quickText {
  min-height: 300px;
  resize: vertical;
  line-height: 1.7;
}
/* =========================
   訂購專用編輯器
   ========================= */

.order-editor {
  width: 100%;
}

.order-textarea {
  width: 100%;
  min-height: 520px;
  box-sizing: border-box;
  resize: vertical;
  line-height: 1.7;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font: inherit;
  background: #fff;
}

.order-tools {
  margin-top: 16px;
}

.order-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.order-method-btn {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font: inherit;
}

.order-method-btn:hover {
  background: #f5f5f5;
}

.order-copy-btn {
  width: 100%;
  margin-top: 16px;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-icon">📋</div>客服罐頭訊息</div>
    <div class="header-actions">
      <button class="btn" onclick="exportData()">匯出資料</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">匯入資料</button>
      <button class="btn" onclick="openCategoryManager()">🏷️ 管理分類</button>
      <button class="btn primary" onclick="openEditor()">＋ 新增訊息</button>
      <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
    </div>
  </header>

  <div class="layout">
    <aside class="panel sidebar">
      <div class="section-title">分類</div>
      <div id="categories"></div>
    </aside>

    <main class="main">
      <div class="toolbar"><button class="btn" onclick="setCategory('all')">全部</button></div>
      <div class="list-head">
        <h2 id="listTitle">所有訊息</h2>
        <div class="muted" id="resultCount"></div>
      </div>
      <div id="bulkBar" class="bulk-bar">
  <label><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"> 全選目前結果</label>
  <span class="selected-count" id="selectedCount">已選 0 則</span>
  <select id="bulkCategory" onchange="bulkMove(this.value)">
    <option value="">移動到分類…</option>
  </select>
  <button class="small-btn" onclick="bulkFavorite(true)">★ 加入常用</button>
  <button class="small-btn" onclick="bulkFavorite(false)">☆ 取消常用</button>
  <button class="small-btn" style="color:var(--danger)" onclick="bulkDelete()">批次刪除</button>
</div>
<div id="cards" class="cards"></div>
    </main>

    <aside class="panel right">
      <h2>👀 訊息預覽</h2>

      <div id="quickEmpty" class="quick-empty">
        點選左側訊息後，<br>這裡會顯示訊息內容
      </div>

      <div id="quickPreview" style="display:none;">
        <div class="form-group">
          <label>訊息內容</label>
          <textarea id="quickText" placeholder="訊息內容…"></textarea>
        </div>
        <button class="btn" style="width:100%; margin-top:8px;" onclick="copyQuickMessage()">
          📋 複製訊息
        </button>
      </div>
    </aside>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">新增訊息</h2>
    <div class="form-group">
      <label>訊息名稱</label>
      <input id="editTitle" placeholder="例如：退款處理中">
    </div>
    <div class="form-group">
      <label>分類</label>
      <select id="editCategory"></select>
    </div>
    <div class="form-group">
      <label>訊息內容</label>
      <textarea id="editText" style="min-height:210px"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeEditor()">取消</button>
      <button class="btn primary" onclick="saveEditor()">儲存</button>
    </div>
  </div>
</div>


<div id="categoryBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2>🏷️ 編輯分類</h2>
    <div class="form-group">
      <label>分類名稱</label>
      <input id="categoryNameInput" placeholder="例如：退款">
    </div>
    <div class="form-group">
      <label>圖示</label>
      <select id="categoryIconInput">
        <option>👋</option><option>📦</option><option>💳</option><option>🚚</option>
        <option>🔄</option><option>❓</option><option>😠</option><option>⭐</option>
        <option>💬</option><option>🛠️</option><option>📌</option><option>📝</option>
        <option>🎁</option><option>⚠️</option><option>🏷️</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeCategoryManager()">關閉</button>
      <button class="btn primary" onclick="saveCategory()">儲存分類</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <button class="btn" style="width:100%;margin-bottom:12px" onclick="startNewCategory()">＋ 新增分類</button>
    <div id="categoryManagerList"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

let messages = JSON.parse(JSON.stringify(defaultMessages));

function loadData() {
  try {
    const saved = localStorage.getItem("messages");

    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        messages = parsed;
        return;
      }
    }
  } catch (e) {
    console.warn("讀取儲存資料失敗，改用 HTML 內建資料", e);
  }

  messages = JSON.parse(JSON.stringify(defaultMessages));
}

const ORDER_CATEGORY_ID = "cat_1786257133487";

function allCategories() {
  return [
    {id:"all", icon:"📚", name:"全部", locked:true},
        ...customCategories
  ];
}

function saveData() {
  // 防止錯誤流程把整份既有資料覆蓋成空白。
  if (!Array.isArray(messages) || messages.length === 0) {
    console.warn("messages 為空，取消這次儲存，保護既有資料。");
    return;
  }

  try {
    localStorage.setItem("messages", JSON.stringify(messages));
  } catch (e) {
    console.error("儲存資料失敗", e);
    toast("⚠️ 儲存失敗，原有資料未被覆蓋");
  }
}

function categoryName(id) {
  const c = allCategories().find(x => x.id === id);
  return c ? c.name : id;
}

function renderCategories() {
  const el = document.getElementById("categories");
  el.innerHTML = allCategories().map(c => {
    const count = c.id === "all" ? messages.length :
      messages.filter(m => m.category === c.id).length;
    return `<button class="category ${currentCategory === c.id ? "active" : ""}" onclick="setCategory('${c.id}')">
      <span>${c.icon}</span><span>${c.name}</span><span class="count">${count}</span>
    </button>`;
  }).join("");
  const opts = customCategories;
  document.getElementById("editCategory").innerHTML = opts.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join("");
}

function setCategory(id) {
  currentCategory = id;

  // 切換分類時，先清除右側上一則訊息
  clearQuickPreview();

  render();
}

function getFiltered() {
  return messages.filter(m => {
    return currentCategory === "all" ||
      m.category === currentCategory;
  });
}

  if (!list.length) {
    cards.innerHTML = `<div class="panel empty">目前尚無訊息<br><br><button class="btn" onclick="openCategoryManager()">🏷️ 管理分類</button>
      <button class="btn primary" onclick="openEditor()">＋ 新增訊息</button></div>`;
    return;
  }
  cards.innerHTML = list.map(m => `
    <div class="card ${selectedIds.has(m.id) ? "selected" : ""}" draggable="true" ondragstart="dragMessageStart(event,'${m.id}')" ondragover="dragOver(event)" ondrop="dropMessage(event,'${m.id}')" ondragend="dragEnd(event)">
      <div class="card-top">
        <label class="check-wrap"><input type="checkbox" ${selectedIds.has(m.id) ? "checked" : ""} onchange="toggleSelect('${m.id}', this.checked)"></label>
        <span class="drag-handle" title="拖曳調整順序">⋮⋮</span><div class="card-title">${escapeHtml(m.title)}</div>
        <span class="badge">${escapeHtml(categoryName(m.category))}</span>
        <button class="favorite ${m.favorite ? "on" : ""}" title="加入常用" onclick="toggleFavorite('${m.id}')">${m.favorite ? "★" : "☆"}</button>
      </div>
      <div class="card-text">${escapeHtml(m.text)}</div>
      <div class="card-actions">
        <button class="small-btn" onclick="moveMessage('${m.id}',-1)">↑</button><button class="small-btn" onclick="moveMessage('${m.id}',1)">↓</button><button class="small-btn copy" onclick="copyMessage('${m.id}')">📋 複製</button>
        <button class="small-btn" onclick="loadQuick('${m.id}')">✏️ 編輯</button>
        
        <button class="small-btn" style="margin-left:auto;color:var(--danger)" onclick="deleteMessage('${m.id}')">刪除</button>
      </div>
    </div>
  `).join("");
  updateBulkUI();

}
function renderOrderEditor() {
  const quickPreview = document.getElementById("quickPreview");
  const quickEmpty = document.getElementById("quickEmpty");
  const cards = document.getElementById("cards");
  const ORDER_METHODS = {
  "尚可預約": `目前可以訂購。`,

  "BAS調書": `目前本店無庫存，需向日本通路調書，作業時間約需2~3週。`,

  "這裡填名稱C": `這裡填名稱C實際要插入的完整文字`
};

  // 隱藏右側預覽
  quickPreview.style.display = "none";
  quickEmpty.style.display = "none";

  // 隱藏一般訊息列表相關介面
  document.querySelector(".toolbar").style.display = "none";
  document.querySelector(".list-head").style.display = "none";
  document.getElementById("bulkBar").style.display = "none";

  // 中間改成訂購編輯器
  cards.style.display = "block";

  cards.innerHTML = `
    <div class="order-editor">

      <div class="section-title">
        📚 訂購訊息
      </div>

      <textarea
        id="orderText"
        class="order-textarea"
        placeholder="訂購訊息內容…"
      ></textarea>

      <div class="order-tools">

        <div class="section-title">
          訂購方式快速插入
        </div>

        <div class="order-buttons">

         <button
  type="button"
  class="order-method-btn"
  onclick="insertOrderMethod('尚可預約')"
>
  尚可預約
</button>

<button
  type="button"
  class="order-method-btn"
  onclick="insertOrderMethod('BAS調書')"
>
  BAS調書
</button>

        </div>

      </div>

      <button
        class="btn primary order-copy-btn"
        onclick="copyOrderMessage()"
      >
        📋 複製訊息
      </button>

    </div>
  `;

  // 每次進入訂購分類，都從「乾淨的原始模板」重新建立
  document.getElementById("orderText").value = ORDER_TEMPLATE;
function insertOrderMethod(method) {
  const textarea = document.getElementById("orderText");

  if (!textarea) return;

  const insertText = ORDER_METHODS[method];

  if (!insertText) {
    toast("找不到這個訂購方式");
    return;
  }

  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const currentText = textarea.value;

  const textToInsert =
    "\n\n" + insertText + "\n\n";

  textarea.value =
    currentText.slice(0, start) +
    textToInsert +
    currentText.slice(end);

  // 游標移到剛插入的文字後面
  const newPosition = start + textToInsert.length;

  textarea.selectionStart = newPosition;
  textarea.selectionEnd = newPosition;

  textarea.focus();
}
async function copyOrderMessage() {
  const textarea = document.getElementById("orderText");

  if (!textarea) return;

  const text = textarea.value.trim();

  if (!text) {
    return toast("目前沒有訊息可以複製");
  }

  try {
    await navigator.clipboard.writeText(text);
    toast("✓ 已複製訂購訊息");
  } catch {
    const ta = document.createElement("textarea");

    ta.value = text;
    document.body.appendChild(ta);

    ta.select();
    document.execCommand("copy");

    ta.remove();

    toast("✓ 已複製訂購訊息");
  }
}
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

async function copyMessage(id) {
  const m = messages.find(x => x.id === id);
  if (!m) return;
  try {
    await navigator.clipboard.writeText(m.text);
    toast("✓ 已複製到剪貼簿");
  } catch {
    const ta = document.createElement("textarea");
    ta.value = m.text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast("✓ 已複製到剪貼簿");
  }
}

function toggleFavorite(id) {
  const m = messages.find(x => x.id === id);
  if (!m) return;
  m.favorite = !m.favorite; saveData(); render();
}

function deleteMessage(id) {
  const m = messages.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`確定要刪除「${m.title}」嗎？`)) return;
  messages = messages.filter(x => x.id !== id);
  saveData(); render(); toast("已刪除");
}

function duplicateMessage(id) {
  const m = messages.find(x => x.id === id);
  if (!m) return;
  const copy = {...m, id:"m" + Date.now(), title:m.title + "（副本）", favorite:false};
  messages.push(copy);
  saveData(); render(); toast("已建立副本");
}

function openEditor(id = null) {
  editingId = id;
  const m = id ? messages.find(x => x.id === id) : null;
  document.getElementById("modalTitle").textContent = m ? "編輯訊息" : "新增訊息";
  document.getElementById("editTitle").value = m?.title || "";
  document.getElementById("editText").value = m?.text || "";
  document.getElementById("editCategory").value = m?.category || customCategories[0]?.id || "";
  document.getElementById("modalBackdrop").classList.add("show");
  setTimeout(() => document.getElementById("editTitle").focus(), 50);
}

function closeEditor() {
  document.getElementById("modalBackdrop").classList.remove("show");
  editingId = null;
}

function saveEditor() {
  const title = document.getElementById("editTitle").value.trim();
  const text = document.getElementById("editText").value.trim();
  const category = document.getElementById("editCategory").value;
  if (!title || !text) return toast("請填寫訊息名稱與內容");
  if (!category) return toast("請先建立至少一個分類");
  if (editingId) {
    const m = messages.find(x => x.id === editingId);
    m.title = title; m.text = text; m.category = category;
    toast("✓ 已更新訊息");
  } else {
    messages.push({id:"m" + Date.now(), title, text, category, favorite:false});
    toast("✓ 已新增訊息");
  }
  saveData(); closeEditor(); render();
}

function loadQuick(id) {
  const quickText = document.getElementById("quickText");
  const quickEmpty = document.getElementById("quickEmpty");
  const quickPreview = document.getElementById("quickPreview");

  // 先清除上一筆訊息的內容與編輯狀態
  quickText.value = "";
  delete quickText.dataset.editingId;

  const m = messages.find(x => x.id === id);
  if (!m) {
    quickPreview.style.display = "none";
    quickEmpty.style.display = "block";
    return;
  }

  // 載入新的訊息
  quickText.value = m.text;
  quickText.dataset.editingId = id;

  quickEmpty.style.display = "none";
  quickPreview.style.display = "block";
}

async function copyQuickMessage() {
  const quickText = document.getElementById("quickText");
  const text = quickText.value.trim();

  if (!text) {
    return toast("目前沒有訊息可以複製");
  }

  try {
    await navigator.clipboard.writeText(text);
    toast("✓ 已複製訊息");
  } catch {
    const ta = document.createElement("textarea");

    ta.value = text;
    document.body.appendChild(ta);

    ta.select();
    document.execCommand("copy");

    ta.remove();

    toast("✓ 已複製訊息");
  }
}

function saveQuick() {
  const titleEl = document.getElementById("quickTitle");
  const title = titleEl.value.trim();
  const category = document.getElementById("quickCategory").value;
  const text = document.getElementById("quickText").value.trim();
  const editing = titleEl.dataset.editingId;
  if (!title || !text) return toast("請填寫訊息名稱與內容");
  if (editing) {
    const m = messages.find(x => x.id === editing);
    if (m) { m.title = title; m.category = category; m.text = text; toast("✓ 已更新訊息"); }
    delete titleEl.dataset.editingId;
  } else {
    messages.push({id:"m" + Date.now(), title, category, text, favorite:false});
    toast("✓ 已新增訊息");
  }
  saveData(); clearQuick(); render();
}

function clearQuick() {
  document.getElementById("quickTitle").value = "";

  const quickText = document.getElementById("quickText");
  quickText.value = "";
  delete quickText.dataset.editingId;

  delete document.getElementById("quickTitle").dataset.editingId;
}

function exportData() {
  const backup = {
    version: 2,
    categories: customCategories,
    messages: messages
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "客服罐頭訊息備份.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("✓ 已匯出備份");
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const importedMessages = Array.isArray(data) ? data : data.messages;
      const importedCategories = Array.isArray(data) ? null : data.categories;
      if (!Array.isArray(importedMessages) || !importedMessages.every(m => m.title && m.text && m.category)) throw new Error();

      if (importedCategories) {
        customCategories = importedCategories
          .filter(c => c && c.id && c.name)
          .map(c => ({id:c.id, name:c.name, icon:c.icon || "📌"}));
      }
      messages = importedMessages.map(m => ({
        id:m.id || "m"+Date.now()+Math.random(),
        title:m.title,
        text:m.text,
        category:m.category,
        favorite:!!m.favorite
      }));

      saveData(); render(); toast("✓ 匯入完成");
    } catch { toast("匯入失敗：檔案格式不正確"); }
    event.target.value = "";
  };
  reader.readAsText(file);
}

function moveMessage(id,d){const i=messages.findIndex(m=>m.id===id),j=i+d;if(i<0||j<0||j>=messages.length)return;[messages[i],messages[j]]=[messages[j],messages[i]];saveData();render();}
function dragMessageStart(e,id){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/message-id",id);e.currentTarget.classList.add("dragging");}
function dropMessage(e,target){e.preventDefault();const source=e.dataTransfer.getData("text/message-id");if(!source||source===target)return;const a=messages.findIndex(m=>m.id===source),b=messages.findIndex(m=>m.id===target);if(a<0||b<0)return;const [x]=messages.splice(a,1);messages.splice(b,0,x);saveData();render();}
function moveCategory(id,d){const i=customCategories.findIndex(c=>c.id===id),j=i+d;if(i<0||j<0||j>=customCategories.length)return;[customCategories[i],customCategories[j]]=[customCategories[j],customCategories[i]];saveData();render();renderCategoryManager();}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect="move";}
function dragEnd(e){e.currentTarget.classList.remove("dragging");}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}


function updateBulkUI() {
  const list = getFiltered();
  const count = selectedIds.size;
  document.getElementById("selectedCount").textContent = `已選 ${count} 則`;
  const selectAll = document.getElementById("selectAll");
  selectAll.checked = list.length > 0 && list.every(m => selectedIds.has(m.id));
  selectAll.indeterminate = list.some(m => selectedIds.has(m.id)) && !selectAll.checked;
  const bulk = document.getElementById("bulkCategory");
  if (bulk) {
    bulk.innerHTML = `<option value="">移動到分類…</option>` +
      customCategories.map(c => `<option value="${c.id}">${c.icon} ${escapeHtml(c.name)}</option>`).join("");
  }
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  render();
}

function toggleSelectAll(checked) {
  getFiltered().forEach(m => checked ? selectedIds.add(m.id) : selectedIds.delete(m.id));
  render();
}

function bulkMove(category) {
  if (!category) return;
  if (!selectedIds.size) return toast("請先選擇訊息");
  messages.forEach(m => { if (selectedIds.has(m.id)) m.category = category; });
  saveData(); selectedIds.clear(); render(); toast("✓ 已批次移動分類");
  document.getElementById("bulkCategory").value = "";
}

function bulkFavorite(value) {
  if (!selectedIds.size) return toast("請先選擇訊息");
  messages.forEach(m => { if (selectedIds.has(m.id)) m.favorite = value; });
  saveData(); selectedIds.clear(); render();
  toast(value ? "✓ 已加入常用" : "✓ 已取消常用");
}

function bulkDelete() {
  if (!selectedIds.size) return toast("請先選擇訊息");
  if (!confirm(`確定要刪除選取的 ${selectedIds.size} 則訊息嗎？`)) return;
  messages = messages.filter(m => !selectedIds.has(m.id));
  selectedIds.clear(); saveData(); render(); toast("✓ 已批次刪除");
}

function openCategoryManager() {
  categoryEditingId = null;
  document.getElementById("categoryNameInput").value = "";
  document.getElementById("categoryIconInput").value = "👋";
  document.getElementById("categoryBackdrop").classList.add("show");
  renderCategoryManager();
}

function closeCategoryManager() {
  document.getElementById("categoryBackdrop").classList.remove("show");
  categoryEditingId = null;
}

function renderCategoryManager() {
  const el = document.getElementById("categoryManagerList");
  el.innerHTML = customCategories.map(c => {
    const count = messages.filter(m => m.category === c.id).length;
    return `<div class="cat-manage-row">
      <span>${c.icon}</span>
      <span class="cat-manage-name">${escapeHtml(c.name)}</span>
      <span class="cat-manage-count">${count} 則</span>
      <button class="small-btn" onclick="moveCategory('${c.id}',-1)">↑</button><button class="small-btn" onclick="moveCategory('${c.id}',1)">↓</button><button class="small-btn" onclick="editCategory('${c.id}')">✏️</button>
      <button class="small-btn" style="color:var(--danger)" onclick="deleteCategory('${c.id}')">刪除</button>
    </div>`;
  }).join("");
}

function startNewCategory() {
  categoryEditingId = null;
  document.getElementById("categoryNameInput").value = "";
  document.getElementById("categoryIconInput").value = "👋";
  document.getElementById("categoryNameInput").focus();
}

function editCategory(id) {
  const c = customCategories.find(x => x.id === id);
  if (!c) return;
  categoryEditingId = id;
  document.getElementById("categoryNameInput").value = c.name;
  document.getElementById("categoryIconInput").value = c.icon;
  document.getElementById("categoryNameInput").focus();
}

function saveCategory() {
  const name = document.getElementById("categoryNameInput").value.trim();
  const icon = document.getElementById("categoryIconInput").value;
  if (!name) return toast("請輸入分類名稱");

  if (categoryEditingId) {
    const c = customCategories.find(x => x.id === categoryEditingId);
    if (c) { c.name = name; c.icon = icon; }
    toast("✓ 分類已更新");
  } else {
    customCategories.push({id:"cat_" + Date.now(), name, icon});
    toast("✓ 已新增分類");
  }
  saveData(); render(); renderCategoryManager(); startNewCategory();
}

function deleteCategory(id) {
  const c = customCategories.find(x => x.id === id);
  if (!c) return;
  if (customCategories.length <= 1) return toast("至少要保留一個分類");
  const target = customCategories.find(x => x.id !== id);
  const count = messages.filter(m => m.category === id).length;
  const prompt = count
    ? `「${c.name}」有 ${count} 則訊息。刪除後會移到「${target.name}」，確定嗎？`
    : `確定要刪除「${c.name}」分類嗎？`;
  if (!confirm(prompt)) return;

  messages.forEach(m => { if (m.category === id) m.category = target.id; });
  customCategories = customCategories.filter(x => x.id !== id);
  if (currentCategory === id) currentCategory = "all";
  saveData(); render(); renderCategoryManager(); toast("✓ 分類已刪除");
}

document.getElementById("modalBackdrop").addEventListener("click", e => {
  if (e.target.id === "modalBackdrop") closeEditor();
});
document.getElementById("categoryBackdrop").addEventListener("click", e => {
  if (e.target.id === "categoryBackdrop") closeCategoryManager();
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    if (document.getElementById("modalBackdrop").classList.contains("show")) saveEditor();
  }
});

document.getElementById("quickText").addEventListener("input", () => {
  const id = document.getElementById("quickText").dataset.editingId;
  if (!id) return;
  const m = messages.find(x => x.id === id);
  if (m) {
    m.text = document.getElementById("quickText").value;
    saveData();
  }
});

render();
</script>
